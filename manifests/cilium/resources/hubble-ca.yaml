apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hubble-bootstrap-issuer
  namespace: kube-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hubble-ca-cert
  namespace: kube-system
spec:
  isCA: true
  commonName: "hubble-ca.cilium.io"
  secretName: hubble-ca-secret
  issuerRef:
    name: hubble-bootstrap-issuer
    kind: Issuer
  subject:
    organizations:
      - Cilium
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hubble-ca-issuer
  namespace: kube-system
spec:
  ca:
    secretName: hubble-ca-secret
