apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: argocd:external-secrets.io/ExternalSecret:argocd/argocd-auth
  name: argocd-auth
  namespace: argocd
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: argocd-github
      property: github_client_id
      metadataPolicy: None
    secretKey: github_client_id
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: argocd-github
      property: github_client_secret
      metadataPolicy: None
    secretKey: github_client_secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: argocd-auth
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
