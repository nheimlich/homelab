---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  kustomize.buildOptions: --enable-helm
  resource.exclusions: |
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      clusters:
      - "*"
  resource.customizations.ignoreDifferences: |
    v1/Secret:
      jsonPointers:
        - /metadata/labels/app.kubernetes.io~1instance
    v1/ConfigMap:
      jsonPointers:
        - /data/ipam-multi-pool-pre-allocation
  statusbadge.enabled: 'true'
  url: https://cd.nhlabs.org
  users.anonymous.enabled: 'true'
  admin.enabled: 'false'
  dex.config: |
    connectors:
    - type: github
      id: github
      name: GitHub
      config:
        clientID: $argocd-auth:github_client_id
        clientSecret: $argocd-auth:github_client_secret
        orgs:
        - name: nhlabs-sso
