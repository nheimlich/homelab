---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-agent
  namespace: opentelemetry
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: opentelemetry-collector
    app.kubernetes.io/version: "0.158.0"
    app.kubernetes.io/part-of: opentelemetry-collector
    app.kubernetes.io/component: agent-collector
data:
  relay: |
    exporters:
      otlp_http/victorialogs:
        endpoint: http://victoria-logs-victoria-logs-single-server.victoria-logs.svc.cluster.local:9428/insert/opentelemetry
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_elapsed_time: 120s
          max_interval: 30s
        tls:
          insecure: true
      otlp_http/victoriametrics:
        endpoint: http://victoria-metrics-victoria-metrics-single-server.victoria-metrics.svc.cluster.local:8428/opentelemetry
        tls:
          insecure: true
    extensions:
      file_storage:
        directory: /var/lib/otelcol
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch:
        send_batch_size: 10000
        timeout: 10s
      filter/victorialogs_errors:
        error_mode: ignore
        logs:
          log_record:
          - body == ""
      k8s_attributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.pod.start_time
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.replicaset.uid
          - k8s.daemonset.name
          - k8s.daemonset.uid
          - k8s.job.name
          - k8s.job.uid
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.statefulset.name
          - k8s.statefulset.uid
          - container.image.tag
          - container.image.name
          - k8s.cluster.uid
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          otel_annotations: true
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
    receivers:
      file_log:
        exclude:
        - /var/log/pods/opentelemetry_opentelemetry-collector*_*/opentelemetry-collector/*.log
        include:
        - /var/log/pods/*/*/*.log
        include_file_name: false
        include_file_path: true
        operators:
        - id: container-parser
          max_log_size: 102400
          type: container
        retry_on_failure:
          enabled: true
        start_at: end
        storage: file_storage
      hostmetrics:
        collection_interval: 10s
        root_path: /hostfs
        scrapers:
          cpu: null
          disk: null
          filesystem:
            exclude_fs_types:
              fs_types:
              - autofs
              - binfmt_misc
              - bpf
              - cgroup2
              - configfs
              - debugfs
              - devpts
              - devtmpfs
              - fusectl
              - hugetlbfs
              - iso9660
              - mqueue
              - nsfs
              - overlay
              - proc
              - procfs
              - pstore
              - rpc_pipefs
              - securityfs
              - selinuxfs
              - squashfs
              - sysfs
              - tracefs
              match_type: strict
            exclude_mount_points:
              match_type: regexp
              mount_points:
              - ^/dev($|/)
              - ^/proc($|/)
              - ^/sys($|/)
              - ^/run/k3s/containerd($|/)
              - ^/var/lib/docker($|/)
              - ^/var/lib/kubelet($|/)
              - ^/snap($|/)
          load: null
          memory: null
          network: null
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 20s
        endpoint: ${env:K8S_NODE_IP}:10250
      prometheus:
        config:
          scrape_configs:
          - job_name: hubble-relay
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: kube-system;hubble-relay
              source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_container_name
            - action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:9966
              source_labels:
              - __address__
              target_label: __address__
            scrape_interval: 30s
          - job_name: cert-manager
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: cert-manager;(cert-manager|cert-manager-webhook|cert-manager-cainjector)
              source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_container_name
            - action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:9402
              source_labels:
              - __address__
              target_label: __address__
            scrape_interval: 30s
          - job_name: argocd-server
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: argocd;argocd-server
              source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_container_name
            - action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:8083
              source_labels:
              - __address__
              target_label: __address__
            scrape_interval: 30s
          - job_name: argocd-application-controller
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: argocd;argocd-application-controller
              source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_container_name
            - action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:8082
              source_labels:
              - __address__
              target_label: __address__
            scrape_interval: 30s
          - job_name: kube-state-metrics
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: kube-state-metrics;kube-state-metrics
              source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_container_name
            - action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:8080
              source_labels:
              - __address__
              target_label: __address__
            scrape_interval: 30s
          - job_name: opentelemetry-collector
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: opentelemetry;opentelemetry-collector
              source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_container_name
            - action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:8888
              source_labels:
              - __address__
              target_label: __address__
            scrape_interval: 30s
    service:
      extensions:
      - health_check
      - file_storage
      pipelines:
        logs:
          exporters:
          - otlp_http/victorialogs
          processors:
          - k8s_attributes
          - memory_limiter
          - batch
          - filter/victorialogs_errors
          receivers:
          - file_log
        metrics:
          exporters:
          - otlp_http/victoriametrics
          processors:
          - k8s_attributes
          - memory_limiter
          - batch
          receivers:
          - prometheus
          - hostmetrics
          - kubeletstats
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
        resource:
          host.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
