apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base.yaml
images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.2.0-thick
patches:
  - target:
      kind: DaemonSet
      name: kube-multus-ds
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-multus-ds
      spec:
        template:
          spec:
            initContainers:
              - name: install-multus-binary
                command:
                  - "/usr/src/multus-cni/bin/install_multus"
                  - "-d"
                  - "/host/opt/cni/bin"
                  - "-t"
                  - "thick"
                resources:
                  requests:
                    cpu: "200m"
                    memory: "100Mi"
                  limits:
                    cpu: "300m"
                    memory: "150Mi"
            containers:
              - name: kube-multus
                resources:
                  requests:
                    cpu: "200m"
                    memory: "100Mi"
                  limits:
                    cpu: "300m"
                    memory: "150Mi"
            volumes:
              - name: host-run-netns
                hostPath:
                  path: /var/run/netns/
