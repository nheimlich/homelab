apiVersion: v1
kind: Secret
metadata:
  name: perses-provisioning
  namespace: perses
  labels:
    perses.dev/watch: "true"
stringData:
  project.yaml: |
    kind: Project
    metadata:
      name: perses
  globalrole-admin.yaml: |
    kind: GlobalRole
    metadata:
      name: admin
    spec:
      permissions:
        - actions: ["*"]
          scopes: ["*"]
  globalrolebinding-admin.yaml: |
    kind: GlobalRoleBinding
    metadata:
      name: admin-nheimlich
    spec:
      role: admin
      subjects:
        - kind: User
          name: nheimlich
  datasource-victoriametrics.yaml: |
    kind: Datasource
    metadata:
      name: victoriametrics
      project: perses
    spec:
      display:
        name: VictoriaMetrics
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          directUrl: http://victoria-metrics-victoria-metrics-single-server.victoria-metrics.svc.cluster.local:8428
  datasource-victorialogs.yaml: |
    kind: Datasource
    metadata:
      name: victorialogs
      project: perses
    spec:
      display:
        name: VictoriaLogs
      default: false
      plugin:
        kind: VictoriaLogsDatasource
        spec:
          directUrl: http://victoria-logs-victoria-logs-single-server.victoria-logs.svc.cluster.local:9428
