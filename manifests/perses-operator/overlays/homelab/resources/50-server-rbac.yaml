apiVersion: v1
kind: ServiceAccount
metadata:
  name: perses-server
  namespace: perses
  labels:
    app.kubernetes.io/name: perses
    app.kubernetes.io/instance: perses
    app.kubernetes.io/component: server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: perses-server-authn-authz
  labels:
    app.kubernetes.io/name: perses
    app.kubernetes.io/instance: perses
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: perses-server-authn-authz
  labels:
    app.kubernetes.io/name: perses
    app.kubernetes.io/instance: perses
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: perses-server-authn-authz
subjects:
  - kind: ServiceAccount
    name: perses-server
    namespace: perses
