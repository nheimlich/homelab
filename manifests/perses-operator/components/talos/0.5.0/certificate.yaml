---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        app.kubernetes.io/component: certificate
        app.kubernetes.io/created-by: perses-operator
        app.kubernetes.io/instance: serving-cert
        app.kubernetes.io/name: certificate
        app.kubernetes.io/part-of: perses-operator
    name: perses-operator-serving-cert
    namespace: perses
spec:
    dnsNames:
        - perses-operator-webhook-service.perses.svc
        - perses-operator-webhook-service.perses.svc.cluster.local
        - perses-operator-controller-manager-metrics-service.perses.svc
        - perses-operator-controller-manager-metrics-service.perses.svc.cluster.local
    issuerRef:
        kind: Issuer
        name: perses-operator-selfsigned-issuer
    secretName: perses-operator-webhook-server-cert
