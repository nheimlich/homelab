---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/component: manager
        app.kubernetes.io/created-by: perses-operator
        app.kubernetes.io/instance: controller-manager
        app.kubernetes.io/name: perses-operator
        app.kubernetes.io/part-of: perses-operator
        control-plane: controller-manager
    name: perses-operator-controller-manager
    namespace: perses
spec:
    replicas: 1
    selector:
        matchLabels:
            control-plane: controller-manager
    template:
        metadata:
            annotations:
                kubectl.kubernetes.io/default-container: manager
            labels:
                control-plane: controller-manager
        spec:
            affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                        - amd64
                        - arm64
                        - ppc64le
                        - s390x
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
            containers:
                - args:
                    - --metrics-bind-address=127.0.0.1:8082
                    - --health-probe-bind-address=:8081
                    - --leader-elect
                  image: "docker.io/persesdev/perses-operator:v0.5.0"
                  imagePullPolicy: IfNotPresent
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: 8081
                    initialDelaySeconds: 15
                    periodSeconds: 20
                  name: manager
                  ports:
                    - containerPort: 9443
                      name: webhook-server
                      protocol: TCP
                  readinessProbe:
                    httpGet:
                        path: /readyz
                        port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    limits:
                      cpu: 500m
                      memory: 128Mi
                    requests:
                      cpu: 10m
                      memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                  volumeMounts:
                    - mountPath: /tmp/k8s-webhook-server/serving-certs
                      name: cert
                      readOnly: true
                - args:
                    - --secure-listen-address=0.0.0.0:8443
                    - --upstream=http://127.0.0.1:8082/
                    - --tls-cert-file=/etc/tls/serving-certs/tls.crt
                    - --tls-private-key-file=/etc/tls/serving-certs/tls.key
                    - --logtostderr=true
                    - --v=0
                  image: "quay.io/brancz/kube-rbac-proxy:v0.22.1"
                  name: kube-rbac-proxy
                  ports:
                    - containerPort: 8443
                      name: https
                      protocol: TCP
                  resources:
                    limits:
                      cpu: 500m
                      memory: 128Mi
                    requests:
                      cpu: 5m
                      memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                  volumeMounts:
                    - mountPath: /etc/tls/serving-certs
                      name: cert
                      readOnly: true
            serviceAccountName: perses-operator-controller-manager
            terminationGracePeriodSeconds: 10
            volumes:
                - name: cert
                  secret:
                    defaultMode: 420
                    secretName: perses-operator-webhook-server-cert
