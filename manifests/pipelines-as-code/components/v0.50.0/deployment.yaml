---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipelines-as-code-watcher
  namespace: pipelines-as-code
  labels:
    app.kubernetes.io/version: "v0.50.0"
    app.kubernetes.io/part-of: pipelines-as-code
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: watcher
      app.kubernetes.io/component: watcher
      app.kubernetes.io/instance: default
      app.kubernetes.io/part-of: pipelines-as-code
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watcher
        app.kubernetes.io/component: watcher
        app.kubernetes.io/instance: default
        app.kubernetes.io/part-of: pipelines-as-code
        app.kubernetes.io/version: "v0.50.0"
        app: pipelines-as-code-watcher
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: pipelines-as-code-watcher
      containers:
        - name: pac-watcher
          image: "ghcr.io/tektoncd/pipelines-as-code/pipelines-as-code-watcher:v0.50.0"
          imagePullPolicy: Always
          env:
          - name: CONFIG_LOGGING_NAME
            value: pac-config-logging
          - name: SYSTEM_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: METRICS_DOMAIN
            value: tekton.dev/pipelinesascode
          - name: CONFIG_OBSERVABILITY_NAME
            value: pipelines-as-code-config-observability
          - name: CONFIG_LEADERELECTION_NAME
            value: pac-watcher-config-leader-election
          - name: KUBERNETES_MIN_VERSION
            value: "v1.28.0"
          ports:
          - name: probes
            containerPort: 8080
          - name: metrics
            containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /live
              port: probes
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: probes
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
