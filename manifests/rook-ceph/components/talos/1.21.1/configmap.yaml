---
# Operator settings that can be updated without an operator restart
# Operator settings that require an operator restart are found in the operator env vars
kind: ConfigMap
apiVersion: v1
metadata:
  name: rook-ceph-operator-config
  namespace: rook-ceph # namespace:operator
  labels:
    operator: rook
    storage-backend: ceph
    app.kubernetes.io/name: rook-ceph
    app.kubernetes.io/instance: rook-ceph
    app.kubernetes.io/version: v1.21.1
    app.kubernetes.io/part-of: rook-ceph-operator
data:
  ROOK_LOG_LEVEL: "INFO"
  ROOK_CEPH_COMMANDS_TIMEOUT_SECONDS: "15"
  ROOK_OBC_WATCH_OPERATOR_NAMESPACE: "true"
  ROOK_OBC_ALLOW_ADDITIONAL_CONFIG_FIELDS: "maxObjects,maxSize"
  ROOK_CEPH_ALLOW_LOOP_DEVICES: "false"
  ROOK_CEPH_MON_RUN_AS_ROOT: "false"
  ROOK_DELETE_UNUSED_CRUSH_RULES: "true"
  ROOK_ENABLE_DISCOVERY_DAEMON: "false"
  ROOK_CREATE_CSI_OPERATOR_RESOURCES:
---
# ImageSet ConfigMap defines the container images used by the CSI drivers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-csi-operator-image-set-configmap
  namespace: rook-ceph # namespace:operator
  labels:
    operator: rook
    storage-backend: ceph
    app.kubernetes.io/name: rook-ceph
    app.kubernetes.io/instance: rook-ceph
    app.kubernetes.io/version: v1.21.1
    app.kubernetes.io/part-of: rook-ceph-operator
data:
  provisioner: ""
  attacher: ""
  resizer: ""
  snapshotter: ""
  registrar: ""
  plugin: ""
  addons: ""
