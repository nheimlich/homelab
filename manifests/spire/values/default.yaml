global:
  spire:
    trustDomain: nhlabs.org
    clusterName: homelab
    namespaces:
      system:
        name: spire-system
      server:
        name: spire-system
    recommendations:
      enabled: true
      namespaceLayout: true
      namespacePSS: true
      priorityClassName: true
      strictMode: false
      securityContexts: true
      prometheus: true

spire-server:
  enabled: true
  kind: statefulset
  controllerManager:
    enabled: true
  externalControllerManagers:
    enabled: true
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: spire-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

spire-agent:
  enabled: true

spiffe-csi-driver:
  enabled: true

spiffe-oidc-discovery-provider:
  enabled: true
